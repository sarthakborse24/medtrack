{% extends "base.html" %}
{% block title %}Submit Diagnosis{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">

      <div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
          <h1 class="page-title">
            <i class="bi bi-plus-circle me-2 text-med-accent"></i>Submit Diagnosis
          </h1>
          <p class="page-subtitle">
            Patient: {{ patient.Name if patient else 'Unknown' }} &mdash;
            {{ appointment.Date }} at {{ appointment.Time }}
          </p>
        </div>
        <a href="{{ url_for('doctors.dashboard') }}" class="btn btn-med-outline">
          <i class="bi bi-arrow-left me-2"></i>Cancel
        </a>
      </div>

      <div class="card-med p-4">
        <form method="POST" action="{{ url_for('doctors.submit_diagnosis', appointment_id=appointment.AppointmentID) }}" novalidate>
          <div class="mb-3">
            <label for="diagnosis" class="form-label">Diagnosis <span class="text-danger">*</span></label>
            <textarea class="form-control" id="diagnosis" name="diagnosis" rows="4"
                      placeholder="Describe the diagnosis…" required>{{ request.form.get('diagnosis', '') }}</textarea>
          </div>
          <div class="mb-3">
            <label for="prescription" class="form-label">Prescription</label>
            <textarea class="form-control" id="prescription" name="prescription" rows="3"
                      placeholder="Medications, dosage, duration…">{{ request.form.get('prescription', '') }}</textarea>
          </div>
          <div class="mb-4">
            <label for="notes" class="form-label">Additional Notes</label>
            <textarea class="form-control" id="notes" name="notes" rows="2"
                      placeholder="Follow-up instructions, lifestyle advice…">{{ request.form.get('notes', '') }}</textarea>
          </div>
          <button type="submit" class="btn btn-med-primary w-100">
            <i class="bi bi-check-circle-fill me-2"></i>Submit Diagnosis Report
          </button>
        </form>
      </div>

    </div>
  </div>
</div>
{% endblock %}
