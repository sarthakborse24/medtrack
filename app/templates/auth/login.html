{% extends "base.html" %}
{% block title %}Patient Login{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">

      <div class="text-center mb-4">
        <div class="icon-circle ic-blue mx-auto mb-3" style="width:64px;height:64px;font-size:1.8rem;">
          <i class="bi bi-person-circle"></i>
        </div>
        <h1 class="fw-700 fs-3 mb-1">Patient Login</h1>
        <p class="text-med-muted">Access your MedTrack account</p>
      </div>

      <div class="card-med p-4">
        <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" name="email"
                   placeholder="jane@example.com" value="{{ email or '' }}" required autocomplete="email">
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="Your password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-med-primary w-100">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
          </button>
        </form>
      </div>

      <p class="text-center text-med-muted mt-3 small">
        Don't have an account?
        <a href="{{ url_for('auth.register') }}" class="text-med-accent text-decoration-none fw-500">Register</a>
      </p>
      <p class="text-center text-med-muted small">
        Are you a doctor?
        <a href="{{ url_for('auth.doctor_login') }}" class="text-med-accent text-decoration-none fw-500">Doctor login</a>
      </p>

    </div>
  </div>
</div>
{% endblock %}
